[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-review-agent"
version = "0.0.1"
description = "Multi-step code review agent built on Anthropic Tool Use, packaged as a GitHub Action"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yunhao Dou" }]
keywords = ["agent", "code-review", "anthropic", "claude", "github-action", "tool-use"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "anthropic>=0.30",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
code-review-agent = "code_review_agent.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
